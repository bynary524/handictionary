
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한자전</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        input, button {
            padding: 10px;
            font-size: 16px;
        }

        #output {
            padding: 20px;
            background: #f0f0f0;
            border-radius: 10px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            min-height: 150px;
        }
    </style>
</head>
<body>
    <h1>환영합니다. 지금은 테스트 버전입니다!</h1>

    <input
        type="number"
        id="pageInput"
        min="1"
        step="1"
        value="1"
        placeholder="페이지 번호"
    >

    <button id="loadButton">수록 한자 보기</button>

    <p id="info"></p>
    <pre id="output">불러오는 중...</pre>

    <script>
        const output = document.getElementById("output");
        const pageInput = document.getElementById("pageInput");
        const info = document.getElementById("info");
        const button = document.getElementById("loadButton");

        let lines = [];

        async function loadFile() {
            try {
                const response = await fetch("./천자.txt");

                if (!response.ok) {
                    throw new Error("파일을 읽을 수 없습니다.");
                }

                const text = await response.text();
                lines = text.split(/\r?\n/);

                showPage();
            } catch (error) {
                output.textContent = "오류: " + error.message;
                info.textContent = "";
            }
        }

        function showPage() {
            const page = Number(pageInput.value);

            if (
                pageInput.value.trim() === "" ||
                !Number.isInteger(page) ||
                page < 1
            ) {
                output.textContent = "1 이상의 정수를 입력하세요.";
                info.textContent = "";
                return;
            }

            const start = (page - 1) * 10;
            const end = start + 10;

            const pageLines = lines.slice(start, end);

            if (pageLines.length === 0) {
                output.textContent = "해당 페이지에 내용이 없습니다.";
                info.textContent = `전체 ${lines.length}줄`;
                return;
            }

            output.textContent = pageLines.join("\n");

            info.textContent =
                `${start + 1}~${Math.min(end, lines.length)}번째 줄 / ` +
                `전체 ${lines.length}줄`;
        }

        button.addEventListener("click", showPage);

        pageInput.addEventListener("keydown", event => {
            if (event.key === "Enter") {
                showPage();
            }
        });
        loadFile();
    </script>
</body>
</html>
