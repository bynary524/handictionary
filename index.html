
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한자전</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        #output {
            padding: 20px;
            background: #f0f0f0;
            border-radius: 10px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        button {
            padding: 10px 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>안녕하세요!</h1>

    <button id="loadButton">파일 불러오기</button>

    <pre id="output">버튼을 눌러 TXT 파일을 읽으세요.</pre>

    <script>
        const button = document.getElementById("loadButton");
        const output = document.getElementById("output");

        async function loadText() {
            output.textContent = "불러오는 중...";

            try {
                const response = await fetch("./천자.txt");

                if (!response.ok) {
                    throw new Error(
                        `파일 읽기 실패: HTTP ${response.status} :(`
                    );
                }

                const text = await response.text();

                output.textContent = text;
            } catch (error) {
                output.textContent =
                    "오류가 발생했습니다: " + error.message;
            }
        }

        button.addEventListener("click", loadText);
    </script>
</body>
</html>
